<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - HostelHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102,126,234,0.3);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .back-btn {
            background: #eee;
            color: #333;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>👨‍🎓 Add Student</h1>

        <p class="subtitle">
            Register a new hostel student
        </p>

        <form action="StudentServlet" method="post">

            <div class="form-group">
                <label>Register Number</label>
                <input
                    type="number"
                    name="registerNo"
                    placeholder="Enter register number"
                    required>
            </div>

            <div class="form-group">
                <label>Student Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter student name"
                    required>
            </div>

            <div class="form-group">
                <label>Department</label>
                <input
                    type="text"
                    name="department"
                    placeholder="Enter department"
                    required>
            </div>

            <div class="form-group">
                <label>Room Number</label>
                <input
                    type="text"
                    name="roomNo"
                    placeholder="Example: R-105"
                    required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input
                    type="text"
                    name="phone"
                    placeholder="Enter phone number"
                    required>
            </div>

            <div class="buttons">

                <button
                    type="button"
                    class="back-btn"
                    onclick="window.location.href='students.html'">
                    ← Back
                </button>

                <button
                    type="submit"
                    class="submit-btn">
                    Add Student
                </button>

            </div>

        </form>

    </div>

</body>
</html>
